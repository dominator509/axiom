# ============================================================================
# Pre-commit hooks for AXIOM FanvueCRM
# ============================================================================
# Install: pre-commit install
# Run all hooks: pre-commit run --all-files
# Update revs:   pre-commit autoupdate
# ============================================================================

repos:
  # --------------------------------------------------------------------------
  # Standard pre-commit hooks (general file hygiene)
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  # --------------------------------------------------------------------------
  # Local hooks (project-specific tools)
  #
  # These assume the project dependencies are installed and tools are on PATH.
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        files: \.(ts|tsx)$
        types: [file]
        args:
          - --max-warnings=0
        # Run on the packages directories; the root config is used automatically

      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        types: [text]
        files: \.(ts|tsx|js|json|yaml|yml|md|css|html)$
        args: []

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy
        language: system
        files: \.(rs)$
        types: [file]
        pass_filenames: false
        args:
          - --workspace
          - --
          - -D
          - warnings

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.(sh)$
        types: [file]
        args:
          - --severity=warning
