name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # The CI runner uses host networking for the dashboard/API smoke fixture.
  # Production deployments must provide their real service origin explicitly.
  API_ORIGIN: http://127.0.0.1:3001

permissions:
  contents: read

jobs:
  l5-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
      - name: Fetch checksum-pinned public vision model
        run: sh scripts/fetch-vision-model.sh
      - name: Real isolated worker, model and audit acceptance
        run: node scripts/rehearse-l5-runtime.mjs --isolated-fixture
      - name: Preserve full runtime receipt
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const root = "var/l5-runtime";
            if (!fs.existsSync(root)) throw new Error("Runtime receipt unavailable");
            for (const entry of fs.readdirSync(root)) console.log(fs.readFileSync(`${root}/${entry}/receipt.json`, "utf8"));
          '
  recovery-dr:
    # This job owns two independent physical PITR fixtures. Both clusters have
    # Docker network=none; no ambient database, cloud credentials, or .env is used.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
      - name: Reject unsafe recovery harness execution contexts
        run: node scripts/test-recovery-harness-guards.mjs
      - name: Run two isolated physical PITR drills
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/rehearse-pitr-recovery.mjs --isolated-fixture --tested-sha "$TESTED_SHA"
      - name: Preserve recovery receipt
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const root = "var/recovery-dr";
            if (!fs.existsSync(root)) throw new Error("Recovery receipt unavailable");
            const entries = fs.readdirSync(root);
            if (entries.length !== 1) throw new Error("Expected one source-bound recovery receipt");
            const receipt = `${root}/${entries[0]}/receipt.json`;
            if (!fs.existsSync(receipt)) throw new Error("Recovery receipt unavailable");
            console.log(fs.readFileSync(receipt, "utf8"));
          '
  browser:
    # Independent of the matrix. Owns its database, credentials and internal
    # network; no shared service, production URL or repository secret is used.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
      - name: Real Chromium sign-in and public brand acceptance
        run: node scripts/rehearse-browser.mjs --isolated-fixture
      - name: Preserve browser receipt and sanitized logs
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const root = "var/browser-rehearsal";
            if (!fs.existsSync(root)) throw new Error("Browser receipt unavailable");
            for (const entry of fs.readdirSync(root)) {
              const dir = `${root}/${entry}`;
              console.log(fs.readFileSync(`${dir}/receipt.json`, "utf8"));
              for (const file of fs.readdirSync(dir).filter(f => f.startsWith("journey-") && f.endsWith(".log"))) {
                console.log(file, fs.readFileSync(`${dir}/${file}`, "utf8"));
              }
            }
          '
  egress-rehearsal:
    # Independent of the JS matrix: an unrelated lint/typecheck failure must
    # not cancel or skip the privileged networking evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
      - name: Run isolated Linux egress acceptance
        # Test processes have no external network, host mounts or published
        # ports. Provisioning capabilities exist only inside this container.
        run: node scripts/rehearse-egress.mjs --isolated-fixture
      - name: Preserve source-bound receipt in job output
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const root = "var/egress-rehearsal";
            let found = false;
            if (fs.existsSync(root)) for (const entry of fs.readdirSync(root)) {
              const file = `${root}/${entry}/receipt.json`;
              if (fs.existsSync(file)) {
                const receipt = JSON.parse(fs.readFileSync(file, "utf8"));
                if (receipt.cleanupVerified !== true) throw new Error(`Rehearsal cleanup was not verified for ${entry}`);
                console.log(JSON.stringify(receipt, null, 2));
                found = true;
              }
            }
            if (!found) { console.error("No runtime receipt produced; acceptance unavailable"); process.exitCode = 1; }
          '
  egress-worker-runtime:
    # Exercise the built Node egress caller in its real isolated namespace
    # fixture. This remains separate from production host-policy acceptance.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: '9.14.0'
      - name: Setup pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
      - name: Verify development and CI environment contract
        run: node scripts/check-ci-environment.mjs
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build egress caller and workspace dependencies
        run: pnpm --filter @axiom/llm-gateway... build
      - name: Rehearse worker namespace caller boundary
        run: node scripts/rehearse-egress-worker-runtime.mjs --isolated-fixture
      - name: Preserve and verify source-bound receipt
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const root = "var/egress-worker-runtime-rehearsal";
            if (!fs.existsSync(root)) throw new Error("Worker egress receipt unavailable");
            const entries = fs.readdirSync(root).filter(entry => fs.existsSync(`${root}/${entry}/receipt.json`));
            if (entries.length !== 1) throw new Error(`Expected one worker egress receipt, found ${entries.length}`);
            const receipt = JSON.parse(fs.readFileSync(`${root}/${entries[0]}/receipt.json`, "utf8"));
            if (receipt.testedSha !== process.env.TESTED_SHA) throw new Error("Worker egress receipt SHA mismatch");
            if (receipt.assertionCount !== 23 || receipt.counts?.total !== 23 || receipt.counts.passed !== 23 || receipt.counts.failed !== 0 || receipt.counts.skipped !== 0) {
              throw new Error(`Worker egress acceptance counts incomplete: ${JSON.stringify(receipt.counts)}`);
            }
            if (!/^[a-f0-9]{64}$/.test(receipt.testOutputSha256 ?? "")) throw new Error("Worker egress test output hash missing");
            if (receipt.cleanupVerified !== true || receipt.productionAcceptance !== false) {
              throw new Error("Worker egress cleanup or scope declaration failed");
            }
            console.log(JSON.stringify(receipt, null, 2));
          '
  observability:
    # Owns a disposable GlitchTip/PostgreSQL network. No repository secret,
    # external endpoint, or persistent volume is used by this acceptance run.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GLITCHTIP_URL: http://127.0.0.1:8000
      GLITCHTIP_IMAGE: glitchtip/glitchtip:6.2.6@sha256:b88013c8e5327fc1d49bd432516746e2eedb9d3cf6dcf739ec9da24be65f74be
      POSTGRES_IMAGE: timescale/timescaledb:2.29.2-pg16@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: '9.14.0'
      - name: Setup pinned Node.js v22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify development and CI environment contract
        run: node scripts/check-ci-environment.mjs
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API and its workspace dependencies
        run: pnpm --filter @axiom/api... build
      - name: Start disposable GlitchTip and PostgreSQL services
        shell: bash
        run: |
          set -euo pipefail
          rehearsal_id="axiom-observability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="$rehearsal_id"
          postgres_container="${rehearsal_id}-postgres"
          glitchtip_container="${rehearsal_id}-glitchtip"
          postgres_password="$(openssl rand -hex 32)"
          secret_key="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$secret_key"

          docker network create "$network" >/dev/null
          docker run --detach \
            --name "$postgres_container" \
            --label "com.fanthynks.rehearsal=$rehearsal_id" \
            --network "$network" \
            --network-alias postgres \
            --env POSTGRES_DB=glitchtip \
            --env POSTGRES_USER=glitchtip \
            --env "POSTGRES_PASSWORD=$postgres_password" \
            "$POSTGRES_IMAGE" >/dev/null

          postgres_ready=false
          for _ in $(seq 1 60); do
            if docker exec "$postgres_container" pg_isready -U glitchtip -d glitchtip >/dev/null 2>&1; then
              postgres_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$postgres_ready" != true ]]; then
            docker logs "$postgres_container"
            echo "Disposable PostgreSQL did not become ready"
            exit 1
          fi

          export DATABASE_URL="postgres://glitchtip:${postgres_password}@postgres:5432/glitchtip"
          export SECRET_KEY="$secret_key"
          docker run --detach \
            --name "$glitchtip_container" \
            --label "com.fanthynks.rehearsal=$rehearsal_id" \
            --network "$network" \
            --publish 127.0.0.1:8000:8000 \
            --env DATABASE_URL \
            --env SECRET_KEY \
            --env GLITCHTIP_DOMAIN=http://127.0.0.1:8000 \
            --env GLITCHTIP_EMBED_WORKER=true \
            --env GLITCHTIP_ENABLE_LOGS=true \
            --env ENABLE_ORGANIZATION_CREATION=true \
            --env VALKEY_URL= \
            --env EMAIL_URL=consolemail:// \
            --env DEFAULT_FROM_EMAIL=observability@example.test \
            "$GLITCHTIP_IMAGE" >/dev/null
      - name: Rehearse real exception, structured log, trace, and privacy capture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p var/observability-rehearsal
          node scripts/rehearse-glitchtip-observability.mjs --isolated-fixture 2>&1 \
            | tee var/observability-rehearsal/test-output.log
      - name: Preserve and verify source-bound observability receipt
        if: always()
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import fs from "node:fs";
            const root = "var/observability-rehearsal";
            if (!fs.existsSync(root)) throw new Error("Observability receipt unavailable");
            const entries = fs.readdirSync(root).filter(entry => fs.existsSync(`${root}/${entry}/receipt.json`));
            if (entries.length !== 1) throw new Error(`Expected one observability receipt, found ${entries.length}`);
            const receiptPath = `${root}/${entries[0]}/receipt.json`;
            const receipt = JSON.parse(fs.readFileSync(receiptPath, "utf8"));
            const rawOutputPath = `${root}/test-output.log`;
            if (!fs.existsSync(rawOutputPath)) throw new Error("Observability harness output log unavailable");
            const rawOutput = fs.readFileSync(rawOutputPath);
            const rawOutputText = rawOutput.toString("utf8");
            if (rawOutputText.includes("fixture-sensitive-") || rawOutputText.includes("@example.test")) {
              throw new Error("Observability harness output contains fixture credential or identity data");
            }
            receipt.harnessOutputSha256 = createHash("sha256").update(rawOutput).digest("hex");
            if (receipt.testedSha !== process.env.TESTED_SHA) throw new Error("Observability receipt SHA mismatch");
            if (receipt.runUrl !== `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`) {
              throw new Error("Observability receipt CI URL mismatch");
            }
            const counts = receipt.counts ?? {};
            if (counts.total !== 15 || counts.passed !== 15 || counts.failed !== 0 || counts.skipped !== 0 || receipt.checks?.length !== 15) {
              throw new Error(`Observability acceptance counts incomplete: ${JSON.stringify(counts)}`);
            }
            if (!/^[a-f0-9]{64}$/.test(receipt.readBackLogSha256 ?? "")) throw new Error("Read-back log SHA-256 missing");
            if (!/^[a-f0-9]{64}$/.test(receipt.harnessOutputSha256)) throw new Error("Harness output SHA-256 missing");
            if (receipt.cleanupVerified !== true || receipt.productionAcceptance !== false || receipt.failure) {
              throw new Error("Observability cleanup, scope declaration, or run status failed");
            }
            if (!receipt.images?.includes(process.env.GLITCHTIP_IMAGE) || !receipt.images?.includes(process.env.POSTGRES_IMAGE)) {
              throw new Error("Observability receipt is missing immutable image identities");
            }
            const serialized = JSON.stringify(receipt);
            if (serialized.includes("fixture-sensitive-") || serialized.includes("@example.test")) {
              throw new Error("Observability receipt contains fixture credential or identity data");
            }
            fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`, "utf8");
            console.log(JSON.stringify(receipt, null, 2));
          '
      - name: Remove and verify only this run's observability services
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rehearsal_id="axiom-observability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          postgres_container="${rehearsal_id}-postgres"
          glitchtip_container="${rehearsal_id}-glitchtip"
          network="$rehearsal_id"
          removed_containers=0
          removed_network=0
          for container in "$glitchtip_container" "$postgres_container"; do
            if docker inspect "$container" >/dev/null 2>&1; then
              docker rm --force "$container" >/dev/null
              removed_containers=$((removed_containers + 1))
            fi
            if docker inspect "$container" >/dev/null 2>&1; then
              echo "Disposable service cleanup failed for a run-owned container"
              exit 1
            fi
          done
          if docker network inspect "$network" >/dev/null 2>&1; then
            docker network rm "$network" >/dev/null
            removed_network=1
          fi
          if docker network inspect "$network" >/dev/null 2>&1; then
            echo "Disposable service cleanup failed for the run-owned network"
            exit 1
          fi
          echo "Observability fixture cleanup: containers_removed=$removed_containers network_removed=$removed_network; run-owned resources absent"
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        # timescale/timescaledb:2.29.2-pg16 manifest digest (resolved 2026-09-09).
        image: timescale/timescaledb:2.29.2-pg16@sha256:289d55704b1b3ee8263cd3805c6930f9cd54506835a8f19f9b85dad17d5c5a8a
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: axiom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom -d axiom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test, build, security, container]

    steps:
      - name: Checkout repository
        # v7.0.1, immutable release commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ── pnpm & Node.js setup (shared across all matrix slots) ──
      - name: Install pnpm
        # v6.1.0, immutable signed release commit.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: '9.14.0'

      - name: Setup Node.js v22 with pnpm cache
        # v7.0.0, immutable release commit.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify development and CI environment contract
        run: node scripts/check-ci-environment.mjs

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust toolchain (needed by test, lint, and build slots) ──
      - name: Setup Rust toolchain
        if: matrix.task == 'test' || matrix.task == 'lint' || matrix.task == 'build' || matrix.task == 'security'
        # stable as of 2026-09-07, immutable commit pin.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy

      # ═══════════════════════════════════════════════════════════
      #  MATRIX TASK: typecheck
      # ═══════════════════════════════════════════════════════════
      - name: TypeScript type checking
        if: matrix.task == 'typecheck'
        run: pnpm typecheck

      - name: Run repository ship gate
        if: matrix.task == 'typecheck'
        run: sh scripts/verify.sh

      - name: Verify phase ledger gate regressions
        if: matrix.task == 'typecheck'
        run: node scripts/test-phase-gates.mjs

      - name: Verify checksummed step marker lifecycle
        if: matrix.task == 'typecheck'
        run: node scripts/test-step-markers.mjs

      - name: Verify release evidence coverage and fail-closed regressions
        if: matrix.task == 'typecheck'
        run: |
          node scripts/check-release-evidence.mjs --check
          node --test scripts/check-release-evidence.test.mjs

      # ═══════════════════════════════════════════════════════════
      #  MATRIX TASK: lint
      # ═══════════════════════════════════════════════════════════
      - name: Run linter
        if: matrix.task == 'lint'
        run: pnpm lint

      - name: Shell syntax check (scripts/)
        if: matrix.task == 'lint'
        run: |
          find scripts/ -maxdepth 1 -name '*.sh' -type f -print -exec sh -n {} \; && echo "Shell syntax: ok"

      - name: Verify deployment base images are immutable
        if: matrix.task == 'lint'
        run: sh scripts/check-container-base-pins.sh

      - name: Verify private files stay outside Docker build contexts
        if: matrix.task == 'lint'
        run: node scripts/test-docker-context.mjs --isolated-fixture

      - name: Verify development database bindings and media mounts
        if: matrix.task == 'lint'
        run: node scripts/check-dev-db-bindings.mjs

      - name: Rust clippy check
        if: matrix.task == 'lint'
        run: |
          for crate in egress-plane media-plane vision-engine scraper; do
            if [ -d "crates/$crate" ]; then
              echo "--- clippy: $crate ---"
              cargo clippy --manifest-path "crates/$crate/Cargo.toml" -- -D warnings
            fi
          done

      # ═══════════════════════════════════════════════════════════
      #  MATRIX TASK: test
      # ═══════════════════════════════════════════════════════════
      - name: Prepare PostgreSQL test schema
        if: matrix.task == 'test'
        env:
          MIGRATOR_DATABASE_URL: postgresql://axiom:changeme@localhost:5432/axiom_test
          PGPASSWORD: changeme
        run: |
          pnpm migrate
          # Rehearse reruns: existing checksums must skip DDL rather than replay it.
          pnpm migrate
          psql -h localhost -U axiom -d axiom_test -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE axiom_app WITH LOGIN PASSWORD 'axiom_app';
          INSERT INTO org (id, name, slug)
          VALUES ('11111111-1111-4111-8111-111111111111', 'CI Test Org', 'ci-test-org')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO model_profile (id, org_id, display_name, handle)
          VALUES (
            '9283b927-b95d-461c-90d0-729bc2d13852',
            '11111111-1111-4111-8111-111111111111',
            'CI Test Model',
            'ci-test-model'
          )
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO consent_record (
            id, org_id, model_id, platform, consent_type, granted,
            granted_at, doc_kind, blob_ref, sha256, valid_from
          ) VALUES
            (
              '33333333-3333-4333-8333-333333333331',
              '11111111-1111-4111-8111-111111111111',
              '9283b927-b95d-461c-90d0-729bc2d13852',
              'x', 'ci-fixture', true, now(), '2257',
              'ci://consent/2257', decode(repeat('00', 32), 'hex'), current_date
            ),
            (
              '33333333-3333-4333-8333-333333333332',
              '11111111-1111-4111-8111-111111111111',
              '9283b927-b95d-461c-90d0-729bc2d13852',
              'x', 'ci-fixture', true, now(), 'model_release',
              'ci://consent/model-release', decode(repeat('00', 32), 'hex'), current_date
            ),
            (
              '33333333-3333-4333-8333-333333333333',
              '11111111-1111-4111-8111-111111111111',
              '9283b927-b95d-461c-90d0-729bc2d13852',
              'x', 'ci-fixture', true, now(), 'id_verify',
              'ci://consent/id-verify', decode(repeat('00', 32), 'hex'), current_date
            ),
            (
              '33333333-3333-4333-8333-333333333334',
              '11111111-1111-4111-8111-111111111111',
              '9283b927-b95d-461c-90d0-729bc2d13852',
              'x', 'ci-fixture', true, now(), 'platform_consent',
              'ci://consent/platform-x', decode(repeat('00', 32), 'hex'), current_date
            )
          ON CONFLICT (id) DO NOTHING;
          SQL

      - name: Verify runtime egress resolver crosses RLS safely
        if: matrix.task == 'test'
        env:
          PGPASSWORD: axiom_app
        run: |
          psql -h localhost -U axiom_app -d axiom_test -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM load_model_network_configs();"

      - name: Verify per-organization egress gate respects RLS
        if: matrix.task == 'test'
        env:
          TEST_DATABASE_URL: postgresql://axiom_app:axiom_app@localhost:5432/axiom_test
        run: cargo test --locked --manifest-path crates/egress-plane/Cargo.toml --features db-integration-tests --test egress_test test_org_publishing_gate_is_rls_scoped -- --exact

      - name: Run focused crash-report body-cache regression
        if: matrix.task == 'test'
        run: pnpm --filter @axiom/api exec vitest run src/routes/crash-reports.test.ts

      - name: Run JS/TS tests
        if: matrix.task == 'test'
        env:
          DATABASE_URL: postgresql://axiom_app:axiom_app@localhost:5432/axiom_test
          TEST_DATABASE_URL: postgresql://axiom_app:axiom_app@localhost:5432/axiom_test
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          # Direct package tests need compiled workspace exports, which Turbo
          # normally supplies through test -> build. Prepare those first, then
          # preserve the ordered Vitest migration receipt against the real DB.
          pnpm --filter @axiom/api... build
          pnpm install --frozen-lockfile
          pnpm --filter @axiom/dashboard test
          pnpm --filter @axiom/api test
          pnpm test
          pnpm typecheck && pnpm lint && pnpm build
          pnpm audit:dependencies

      - name: Run focused viral-loop S2 and bandit acceptance
        if: matrix.task == 'test'
        env:
          DATABASE_URL: postgresql://axiom_app:axiom_app@localhost:5432/axiom_test
          TEST_DATABASE_URL: postgresql://axiom_app:axiom_app@localhost:5432/axiom_test
        run: pnpm --filter @axiom/worker exec vitest run src/viral-retrieval.integration.test.ts

      - name: Rust cargo check
        if: matrix.task == 'test'
        run: |
          for crate in egress-plane media-plane vision-engine scraper; do
            if [ -d "crates/$crate" ]; then
              echo "--- cargo check: $crate ---"
              cargo check --manifest-path "crates/$crate/Cargo.toml"
            fi
          done

      - name: Rust cargo test
        if: matrix.task == 'test'
        run: |
          for crate in egress-plane media-plane vision-engine scraper; do
            if [ -d "crates/$crate" ]; then
              echo "--- cargo test: $crate ---"
              cargo test --manifest-path "crates/$crate/Cargo.toml"
            fi
          done

      - name: Grok CLI sealed-image guard
        if: matrix.task == 'test'
        run: |
          cargo fmt --manifest-path infra/grok-cli/input-guard/Cargo.toml --check
          cargo clippy --locked --manifest-path infra/grok-cli/input-guard/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path infra/grok-cli/input-guard/Cargo.toml

      - name: Grok event-listener thread-safety regression
        if: matrix.task == 'test'
        run: cargo test --locked --manifest-path infra/grok-cli/event-listener-regression/Cargo.toml

      - name: Grok RNG logging-boundary regression
        if: matrix.task == 'test'
        run: |
          node scripts/check-grok-rand-contract.mjs --fetch-upstream
          sh infra/grok-cli/rand-regression/test-linux.sh

      - name: Effective RLS catalog and tenant-write regressions
        if: matrix.task == 'test'
        run: node scripts/rehearse-rls-catalog.mjs --isolated-fixture

      - name: Install runtime rehearsal dependencies
        if: matrix.task == 'test'
        run: |
          # The hosted runner image may carry an unrelated Google Chrome APT
          # source whose rotating index can briefly fail hash verification.
          # Retry once with only that source disabled; all required packages
          # come from the Ubuntu repositories, and other APT failures remain
          # fatal.
          if ! sudo apt-get update; then
            for source in /etc/apt/sources.list.d/*; do
              if [ -f "$source" ] && sudo grep -q -- 'dl.google.com/linux/chrome' "$source"; then
                echo "Disabling transient Google Chrome source: $source"
                sudo mv "$source" "${source}.disabled"
              fi
            done
            sudo apt-get update
          fi
          sudo apt-get install --no-install-recommends -y iproute2 iptables wireguard-tools bubblewrap ffmpeg
          command -v ip
          command -v iptables
          command -v wg
          sudo ip netns list
        shell: bash

      - name: Rehearse real video frame extraction
        if: matrix.task == 'test'
        run: |
          command -v ffmpeg
          command -v ffprobe
          cargo test --locked -p media-plane video_frames::tests::real_ffmpeg_short_clip_coverage_and_cache -- --exact --ignored
        shell: bash

      - name: Rehearse isolated Grok image descriptor handoff
        if: matrix.task == 'test'
        run: |
          cargo build --locked --manifest-path infra/grok-cli/input-guard/Cargo.toml --bins --examples
          pnpm --filter @axiom/llm-gateway build
          # Hosted Ubuntu can restrict unprivileged user namespaces. This is
          # a synthetic privileged fixture, not production/rootless acceptance.
          sudo "$(command -v node)" scripts/rehearse-grok-handoff.mjs --isolated-fixture
        shell: bash

      # ═══════════════════════════════════════════════════════════
      #  MATRIX TASK: build
      # ═══════════════════════════════════════════════════════════
      - name: Build JS/TS packages
        if: matrix.task == 'build'
        run: pnpm build

      - name: Build Rust crates
        if: matrix.task == 'build'
        run: |
          for crate in egress-plane media-plane vision-engine scraper; do
            if [ -d "crates/$crate" ]; then
              echo "--- build: $crate ---"
              cargo build --manifest-path "crates/$crate/Cargo.toml"
            fi
          done

      # ═══════════════════════════════════════════════════════════
      #  MATRIX TASK: security
      # ═══════════════════════════════════════════════════════════
      - name: Install cargo-audit
        if: matrix.task == 'security'
        run: cargo install cargo-audit --locked

      - name: Run repository security gates
        if: matrix.task == 'security'
        run: |
          node scripts/test-security-gate.mjs
          node scripts/test-vitest-mocker.mjs
          node scripts/test-local-grok-origin.mjs
          node scripts/test-local-grok-startup.mjs --isolated-fixture
          node scripts/test-login-stream-compression.mjs
          pnpm security-check

      - name: Audit Grok CLI input guard dependencies
        if: matrix.task == 'security'
        run: cargo audit --file infra/grok-cli/input-guard/Cargo.lock

      - name: Run dependency advisory gate
        if: matrix.task == 'security'
        run: pnpm audit:dependencies

      # ───────────────────────────────────────────────────────────────────────
      #  MATRIX TASK: container
      # ───────────────────────────────────────────────────────────────────────
      - name: Build deployment images
        if: matrix.task == 'container'
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --file infra/Dockerfile.hono --tag axiom-hono:ci .
          docker build --build-arg API_ORIGIN=http://127.0.0.1:3001 --file infra/Dockerfile.next --tag axiom-dashboard:ci .
          docker build --file infra/Dockerfile.worker --tag axiom-worker:ci .
          docker build --file infra/Dockerfile.rust --tag axiom-egress-plane:ci .
          docker build --file infra/Dockerfile.media --tag axiom-media-plane:ci .
          docker build --file infra/Dockerfile.vision --tag axiom-vision-engine:ci .
          docker build --file infra/Dockerfile.scraper --tag axiom-scraper:ci .

      - name: Record immutable deployment image IDs
        if: matrix.task == 'container'
        run: |
          set -euo pipefail
          for image in axiom-hono:ci axiom-dashboard:ci axiom-worker:ci axiom-egress-plane:ci axiom-media-plane:ci axiom-vision-engine:ci axiom-scraper:ci; do
            image_id="$(docker image inspect --format '{{.Id}}' "$image")"
            if [[ ! "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "${image}: expected an immutable image ID"
              exit 1
            fi
            printf '%s %s\n' "$image" "$image_id"
          done

      - name: Smoke-test deployment containers
        if: matrix.task == 'container'
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          ROLLBACK_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          rehearsal_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 6)"
          rehearsal_label="com.fanthynks.rehearsal-id=${rehearsal_id}"
          container_prefix="axiom-ci-${rehearsal_id}"
          egress_container="${container_prefix}-egress"
          media_container="${container_prefix}-media"
          vision_container="${container_prefix}-vision"
          scraper_container="${container_prefix}-scraper"
          hono_container="${container_prefix}-hono"
          dashboard_container="${container_prefix}-dashboard"
          worker_container="${container_prefix}-worker"
          rollback_context=""
          rollback_image=""
          rollback_checks_passed=0
          rollback_started=0
          db_stopped=0

          if [[ ! "${POSTGRES_CONTAINER_ID:-}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "deployment rehearsal: expected this job's disposable PostgreSQL service id"
            exit 1
          fi

          cleanup() {
            rehearsal_status=$?
            trap - EXIT
            cleanup_status=0
            if (( rollback_started )) && (( rehearsal_status != 0 )); then
              rollback_skipped=$((11 - rollback_checks_passed - 1))
              printf 'deployment rollback checks: passed=%s failed=1 skipped=%s total=11\n' \
                "$rollback_checks_passed" "$rollback_skipped"
            fi
            if (( db_stopped )); then
              if ! docker start "$POSTGRES_CONTAINER_ID" >/dev/null 2>&1; then
                echo "deployment rehearsal cleanup: failed to restart its PostgreSQL service"
                cleanup_status=1
              fi
            fi
            for container in "$egress_container" "$media_container" "$vision_container" "$scraper_container" "$hono_container" "$dashboard_container" "$worker_container"; do
              if docker inspect "$container" >/dev/null 2>&1; then
                owned_label="$(docker inspect --format '{{ index .Config.Labels "com.fanthynks.rehearsal-id" }}' "$container" 2>/dev/null || true)"
                if [[ "$owned_label" != "$rehearsal_id" ]]; then
                  echo "deployment rehearsal cleanup: refusing to remove a container without this rehearsal label: ${container}"
                  cleanup_status=1
                elif ! docker rm --force "$container" >/dev/null 2>&1; then
                  echo "deployment rehearsal cleanup: could not remove owned container: ${container}"
                  cleanup_status=1
                fi
              fi
              if docker inspect "$container" >/dev/null 2>&1; then
                echo "deployment rehearsal cleanup: owned container remains: ${container}"
                cleanup_status=1
              fi
            done
            if [[ -n "$rollback_image" ]] && docker image inspect "$rollback_image" >/dev/null 2>&1; then
              if ! docker image rm "$rollback_image" >/dev/null 2>&1; then
                echo "deployment rehearsal cleanup: could not remove rollback image ${rollback_image}"
                cleanup_status=1
              fi
            fi
            if [[ -n "$rollback_context" ]]; then
              case "$rollback_context" in
                "${RUNNER_TEMP}/axiom-rollback-${rehearsal_id}."*)
                  if [[ -d "$rollback_context" ]]; then
                    if ! rm -rf -- "$rollback_context"; then
                      echo "deployment rehearsal cleanup: could not remove rollback source context"
                      cleanup_status=1
                    fi
                  fi
                  if [[ -e "$rollback_context" ]]; then
                    echo "deployment rehearsal cleanup: rollback source context remains"
                    cleanup_status=1
                  fi
                  ;;
                *)
                  echo "deployment rehearsal cleanup: refusing to remove an unowned rollback context"
                  cleanup_status=1
                  ;;
              esac
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$POSTGRES_CONTAINER_ID" 2>/dev/null || true)" != "true" ]]; then
              echo "deployment rehearsal cleanup: this job's PostgreSQL service is not running"
              cleanup_status=1
            fi
            if (( rehearsal_status == 0 && cleanup_status != 0 )); then
              exit 1
            fi
            exit "$rehearsal_status"
          }
          trap cleanup EXIT

          wait_for_health() {
            local container="$1"
            for _ in $(seq 1 45); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
              case "$status" in
                healthy)
                  echo "$container: healthy"
                  return 0
                  ;;
                unhealthy)
                  echo "$container: unhealthy"
                  docker logs "$container"
                  return 1
                  ;;
              esac
              if [ "$(docker inspect --format '{{.State.Status}}' "$container")" = "exited" ]; then
                echo "$container: exited before becoming healthy"
                docker logs "$container"
                return 1
              fi
              sleep 2
            done
            echo "$container: healthcheck timeout"
            docker logs "$container"
            return 1
          }

          start_hono() {
            local image="$1"
            docker run --detach --name "$hono_container" --label "$rehearsal_label" --network host \
              --env NODE_ENV=production \
              --env API_HOST=0.0.0.0 \
              --env DATABASE_URL="postgresql://axiom_app:${ci_database_app_password}@127.0.0.1:5432/axiom_test" \
              --env BETTER_AUTH_SECRET="$ci_auth_value" \
              --env BETTER_AUTH_URL=https://127.0.0.1:3001 \
              --env RELAY_SECRET="$ci_relay_value" \
              --env EGRESS_PLANE_URL=http://127.0.0.1:9090 \
              --env EGRESS_PLANE_TOKEN="$ci_egress_value" \
              "$image"
          }

          record_rollback_pass() {
            rollback_checks_passed=$((rollback_checks_passed + 1))
          }

          ci_auth_value="$(openssl rand -hex 32)"
          ci_relay_value="$(openssl rand -hex 32)"
          ci_egress_value="$(openssl rand -hex 32)"
          ci_media_value="$(openssl rand -hex 32)"
          ci_vision_value="$(openssl rand -hex 32)"
          ci_scraper_value="$(openssl rand -hex 32)"
          ci_database_app_password="$(openssl rand -hex 32)"
          ci_egress_dek="$(openssl rand -hex 32)"

          export MIGRATOR_DATABASE_URL=postgresql://axiom:changeme@127.0.0.1:5432/axiom_test
          export PGPASSWORD=changeme
          pnpm migrate
          psql -h 127.0.0.1 -U axiom -d axiom_test -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE axiom_app WITH LOGIN PASSWORD '${ci_database_app_password}'"

          # The production provisioner/socket lifecycle is covered by the
          # isolated Linux egress rehearsal. This smoke job checks the
          # database-backed control-plane health and deployment boundaries.
          docker run --detach --name "$egress_container" --label "$rehearsal_label" --network host --cap-add=NET_ADMIN \
            --env NODE_ENV=test \
            --env EGRESS_DATABASE_URL="postgresql://axiom_app:${ci_database_app_password}@127.0.0.1:5432/axiom_test" \
            --env EGRESS_PLANE_TOKEN="$ci_egress_value" \
            --env EGRESS_DEK="$ci_egress_dek" \
            axiom-egress-plane:ci
          docker run --detach --name "$media_container" --label "$rehearsal_label" --network host \
            --env NODE_ENV=production \
            --env AXIOM_MEDIA_ADDR=0.0.0.0:8100 \
            --env AXIOM_MEDIA_AUTH_TOKEN="$ci_media_value" \
            axiom-media-plane:ci
          docker run --detach --name "$vision_container" --label "$rehearsal_label" --network host \
            --env NODE_ENV=production \
            --env AXIOM_VISION_ADDR=0.0.0.0:8101 \
            --env AXIOM_VISION_AUTH_TOKEN="$ci_vision_value" \
            --env AXIOM_VISION_MODEL=/opt/axiom/models/nsfw-vit.onnx \
            axiom-vision-engine:ci
          docker run --detach --name "$scraper_container" --label "$rehearsal_label" --network host \
            --env NODE_ENV=production \
            --env AXIOM_SCRAPER_ADDR=0.0.0.0:8102 \
            --env AXIOM_SCRAPER_AUTH_TOKEN="$ci_scraper_value" \
            axiom-scraper:ci
          start_hono axiom-hono:ci
          docker run --detach --name "$dashboard_container" --label "$rehearsal_label" --network host \
            --env NODE_ENV=production \
            --env PORT=3000 \
            --env HOSTNAME=0.0.0.0 \
            axiom-dashboard:ci
          docker run --detach --name "$worker_container" --label "$rehearsal_label" --network host \
            --env NODE_ENV=production \
            --env DATABASE_URL="postgresql://axiom_app:${ci_database_app_password}@127.0.0.1:5432/axiom_test" \
            --env RELAY_SECRET="$ci_relay_value" \
            --env EGRESS_PLANE_URL=http://127.0.0.1:9090 \
            --env EGRESS_PLANE_TOKEN="$ci_egress_value" \
            --env MEDIA_PLANE_URL=http://127.0.0.1:8100 \
            --env MEDIA_PLANE_AUTH_TOKEN="$ci_media_value" \
            --env AXIOM_SERVICE_NAME=worker-ci \
            axiom-worker:ci

          wait_for_health "$egress_container"
          wait_for_health "$media_container"
          wait_for_health "$scraper_container"
          wait_for_health "$hono_container"
          wait_for_health "$dashboard_container"
          wait_for_health "$worker_container"

          # Exercise real identity persistence through the dashboard rewrite,
          # with the API running as the non-owner application database role.
          AXIOM_CI_API_CONTAINER="$hono_container" AXIOM_CI_REHEARSAL_ID="$rehearsal_id" \
            node scripts/smoke-auth.mjs http://127.0.0.1:3000 https://127.0.0.1:3001 --tenant-fixture --wait-for-tos

          # Vision readiness is model-backed. The CI image intentionally does
          # not bundle the 343 MB external model artifact; verify that the
          # binary starts, keeps health public, and protects inference routes.
          for _ in $(seq 1 45); do
            if curl --silent http://127.0.0.1:8101/health >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --show-error http://127.0.0.1:8101/health | grep -q 'model_loaded'; then
            echo "${vision_container}: health response missing model status"
            docker logs "$vision_container"
            exit 1
          fi
          if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8101/vision/nsfw-detect)" != "401" ]; then
            echo "axiom-vision-ci: unauthenticated inference route was not rejected"
            exit 1
          fi
          echo "${vision_container}: public health metadata and unauthenticated inference denial passed (model inference not exercised)"

          curl --fail --silent --show-error \
            -H "x-egress-plane-token: $ci_egress_value" \
            http://127.0.0.1:9090/kill-switch/status >/dev/null
          echo "${egress_container}: authenticated control-plane probe passed"

          if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:8100/media/video/probe \
            --header 'content-type: application/json' \
            --data '{"video_path":"missing.mp4"}')" != "401" ]; then
            echo "${media_container}: unauthenticated media route was not rejected"
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST http://127.0.0.1:8100/media/video/probe \
            --header "authorization: Bearer $ci_media_value" \
            --header 'content-type: application/json' \
            --data '{"video_path":"missing.mp4"}' >/dev/null
          echo "${media_container}: authenticated media boundary probe passed"

          # Liveness only proves that the Hono process is serving HTTP. The
          # readiness endpoint performs the real database dependency check;
          # require it before declaring the deployment image healthy.
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/ready >/dev/null; then
              echo "${hono_container}: ready"
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/ready >/dev/null; then
            echo "${hono_container}: readiness check failed"
            docker logs "$hono_container"
            exit 1
          fi

          # Fail readiness while the exact job-owned PostgreSQL service is down,
          # then prove readiness recovers after that same service returns.
          docker stop --time 2 "$POSTGRES_CONTAINER_ID" >/dev/null
          db_stopped=1
          if [[ "$(docker inspect --format '{{.State.Status}}' "$hono_container")" != "running" ]]; then
            echo "${hono_container}: API process stopped during the database outage"
            docker inspect --format 'state={{.State.Status}} exit_code={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$hono_container"
            exit 1
          fi
          if [[ "$(curl --silent --max-time 3 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/v1/health || true)" != "200" ]]; then
            echo "${hono_container}: liveness did not remain available during the database outage"
            docker inspect --format 'state={{.State.Status}} exit_code={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$hono_container"
            exit 1
          fi
          outage_ready_status=""
          for _ in $(seq 1 30); do
            outage_ready_status="$(curl --silent --max-time 3 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/v1/ready || true)"
            if [[ "$outage_ready_status" == "503" ]]; then break; fi
            sleep 1
          done
          if [[ "$outage_ready_status" != "503" ]]; then
            echo "${hono_container}: readiness did not fail closed during the PostgreSQL outage (HTTP ${outage_ready_status:-no-response})"
            exit 1
          fi
          docker start "$POSTGRES_CONTAINER_ID" >/dev/null
          db_stopped=0
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/api/v1/ready >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/api/v1/ready >/dev/null
          echo "${hono_container}: readiness failed closed during database outage and recovered after database restart"

          # Exercise scanner-sidecar loss and recovery without sending any
          # media to an external service or relying on a bundled model artifact.
          docker stop --time 2 "$vision_container" >/dev/null
          if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8101/health >/dev/null 2>&1; then
            echo "${vision_container}: health remained available after the scanner container stopped"
            exit 1
          fi
          docker start "$vision_container" >/dev/null
          scanner_recovered=false
          scanner_health_status=
          for _ in $(seq 1 45); do
            scanner_health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://127.0.0.1:8101/health 2>/dev/null || true)"
            scanner_running="$(docker inspect --format '{{.State.Running}}' "$vision_container")"
            if [[ "$scanner_running" == "true" && "$scanner_health_status" == "503" ]]; then
              scanner_recovered=true
              break
            fi
            sleep 2
          done
          if [[ "$scanner_recovered" != "true" ]]; then
            echo "${vision_container}: scanner process did not recover with its expected model-unavailable readiness response"
            docker logs "$vision_container"
            exit 1
          fi
          scanner_health_body="$(curl --silent --show-error --max-time 3 http://127.0.0.1:8101/health)"
          if ! printf '%s' "$scanner_health_body" | grep -q '"model_loaded":false'; then
            echo "${vision_container}: scanner recovery did not retain the expected model-unavailable health state"
            exit 1
          fi
          if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8101/vision/nsfw-detect)" != "401" ]; then
            echo "${vision_container}: unauthenticated inference route was not rejected after restart"
            exit 1
          fi
          echo "${vision_container}: scanner process recovered; model readiness remains unavailable without the external artifact and inference remains protected"

          rollback_started=1
          rollback_sha="${ROLLBACK_SHA:-}"
          candidate_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' axiom-hono:ci)"
          checkout_sha="$(git rev-parse HEAD)"
          if [[ ! "$rollback_sha" =~ ^[a-f0-9]{40}$ || "$rollback_sha" == "$candidate_sha" ]]; then
            echo "deployment rollback: expected a distinct full base commit SHA"
            exit 1
          fi
          record_rollback_pass
          if [[ "$candidate_sha" != "$checkout_sha" ]]; then
            echo "deployment rollback: candidate image revision does not match the checked-out source"
            exit 1
          fi
          record_rollback_pass
          rollback_context="$(mktemp -d "${RUNNER_TEMP}/axiom-rollback-${rehearsal_id}.XXXXXX")"
          rollback_image="axiom-hono:rollback-${rehearsal_id}"
          git fetch --no-tags --depth=1 origin "$rollback_sha"
          git archive "$rollback_sha" | tar -x -C "$rollback_context"
          docker build --label "org.opencontainers.image.revision=$rollback_sha" \
            --file "$rollback_context/infra/Dockerfile.hono" --tag "$rollback_image" "$rollback_context"
          rollback_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$rollback_image")"
          candidate_image_id="$(docker image inspect --format '{{.Id}}' axiom-hono:ci)"
          rollback_image_id="$(docker image inspect --format '{{.Id}}' "$rollback_image")"
          if [[ "$rollback_revision" != "$rollback_sha" ]]; then
            echo "deployment rollback: base image revision label does not match the base commit"
            exit 1
          fi
          record_rollback_pass
          if [[ "$rollback_image_id" == "$candidate_image_id" ]]; then
            echo "deployment rollback: candidate and base images must have distinct immutable identities"
            exit 1
          fi
          record_rollback_pass
          printf 'deployment rollback images: candidate=%s %s base=%s %s\n' \
            "$candidate_sha" "$candidate_image_id" "$rollback_sha" "$rollback_image_id"

          docker stop --time 10 "$hono_container" >/dev/null
          docker rm "$hono_container" >/dev/null
          start_hono "$rollback_image" >/dev/null
          wait_for_health "$hono_container"
          record_rollback_pass
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/api/v1/ready >/dev/null
          record_rollback_pass
          if [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/v1/models)" != "401" ]]; then
            echo "deployment rollback: base image did not preserve the unauthenticated API boundary"
            exit 1
          fi
          record_rollback_pass
          if [[ "$(docker inspect --format '{{.Image}}' "$hono_container")" != "$rollback_image_id" ]]; then
            echo "deployment rollback: running service is not the immutable base image"
            exit 1
          fi
          record_rollback_pass
          echo "deployment rollback: base image became healthy, ready, and retained the authentication boundary"

          docker stop --time 10 "$hono_container" >/dev/null
          docker rm "$hono_container" >/dev/null
          start_hono axiom-hono:ci >/dev/null
          wait_for_health "$hono_container"
          record_rollback_pass
          if [[ "$(docker inspect --format '{{.Image}}' "$hono_container")" != "$candidate_image_id" ]]; then
            echo "deployment rollback: candidate image was not restored"
            exit 1
          fi
          record_rollback_pass
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/api/v1/ready >/dev/null
          record_rollback_pass
          if (( rollback_checks_passed != 11 )); then
            echo "deployment rollback: expected 11 acceptance checks"
            exit 1
          fi
          echo "deployment rollback checks: passed=$rollback_checks_passed failed=0 skipped=0 total=11"
          echo "deployment rollback: candidate image restored and ready; rehearsal cleanup is run-scoped"
