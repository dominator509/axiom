name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.29.2-pg16
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: axiom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom -d axiom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    strategy:
      fail-fast: true
      matrix:
        task: [typecheck, lint, test, build, security, container]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── pnpm & Node.js setup (shared across all matrix slots) ──
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.14.0'

      - name: Setup Node.js v22 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust toolchain (needed by test, lint, and build slots) ──
      - name: Setup Rust toolchain
        if: matrix.task == 'test' || matrix.task == 'lint' || matrix.task == 'build' || matrix.task == 'security'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # ═══════════════════════════════════════════════════════════
      #  MATRIX TASK: typecheck
      # ═══════════════════════════════════════════════════════════
      - name: TypeScript type checking
        if: matrix.task == 'typecheck'
        run: pnpm typecheck

      # ═══════════════════════════════════════════════════════════
      #  MATRIX TASK: lint
      # ═══════════════════════════════════════════════════════════
      - name: Run linter
        if: matrix.task == 'lint'
        run: pnpm lint

      - name: Shell syntax check (scripts/)
        if: matrix.task == 'lint'
        run: |
          find scripts/ -maxdepth 1 -name '*.sh' -type f -print -exec sh -n {} \; && echo "Shell syntax: ok"

      - name: Rust clippy check
        if: matrix.task == 'lint'
        run: |
          for crate in egress-plane media-plane vision-engine scraper; do
            if [ -d "crates/$crate" ]; then
              echo "--- clippy: $crate ---"
              cargo clippy --manifest-path "crates/$crate/Cargo.toml" -- -D warnings
            fi
          done

      # ═══════════════════════════════════════════════════════════
      #  MATRIX TASK: test
      # ═══════════════════════════════════════════════════════════
      - name: Prepare PostgreSQL test schema
        if: matrix.task == 'test'
        env:
          MIGRATOR_DATABASE_URL: postgresql://axiom:changeme@localhost:5432/axiom_test
          PGPASSWORD: changeme
        run: |
          pnpm migrate
          psql -h localhost -U axiom -d axiom_test -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE axiom_app WITH LOGIN PASSWORD 'axiom_app';
          INSERT INTO org (id, name, slug)
          VALUES ('11111111-1111-4111-8111-111111111111', 'CI Test Org', 'ci-test-org')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO model_profile (id, org_id, display_name, handle)
          VALUES (
            '9283b927-b95d-461c-90d0-729bc2d13852',
            '11111111-1111-4111-8111-111111111111',
            'CI Test Model',
            'ci-test-model'
          )
          ON CONFLICT (id) DO NOTHING;
          SQL

      - name: Run JS/TS tests
        if: matrix.task == 'test'
        env:
          DATABASE_URL: postgresql://axiom_app:axiom_app@localhost:5432/axiom_test
          TEST_DATABASE_URL: postgresql://axiom_app:axiom_app@localhost:5432/axiom_test
        run: pnpm test

      - name: Rust cargo check
        if: matrix.task == 'test'
        run: |
          for crate in egress-plane media-plane vision-engine scraper; do
            if [ -d "crates/$crate" ]; then
              echo "--- cargo check: $crate ---"
              cargo check --manifest-path "crates/$crate/Cargo.toml"
            fi
          done

      - name: Rust cargo test
        if: matrix.task == 'test'
        run: |
          for crate in egress-plane media-plane vision-engine scraper; do
            if [ -d "crates/$crate" ]; then
              echo "--- cargo test: $crate ---"
              cargo test --manifest-path "crates/$crate/Cargo.toml"
            fi
          done

      - name: RLS coverage check — verify ENABLE ROW LEVEL SECURITY policies
        if: matrix.task == 'test'
        run: |
          MATCHES=$(grep -r "ENABLE ROW LEVEL SECURITY" packages/db/migrations/ 2>/dev/null | wc -l)
          echo "RLS policy statements found: $MATCHES"
          if [ "$MATCHES" -ge 15 ]; then
            echo "RLS coverage: PASS (>= 15)"
          else
            echo "RLS coverage: FAIL — only $MATCHES ENABLE ROW LEVEL SECURITY statements found (expected >= 15)"
            exit 1
          fi

      - name: Egress test stub (requires sudo — skipped in CI)
        if: matrix.task == 'test'
        run: |
          echo "Egress integration test requires sudo and network namespace setup."
          echo "This test is skipped in CI. Run manually with: sudo cargo test --manifest-path crates/egress-plane/Cargo.toml"
        shell: bash

      # ═══════════════════════════════════════════════════════════
      #  MATRIX TASK: build
      # ═══════════════════════════════════════════════════════════
      - name: Build JS/TS packages
        if: matrix.task == 'build'
        run: pnpm build

      - name: Build Rust crates
        if: matrix.task == 'build'
        run: |
          for crate in egress-plane media-plane vision-engine scraper; do
            if [ -d "crates/$crate" ]; then
              echo "--- build: $crate ---"
              cargo build --manifest-path "crates/$crate/Cargo.toml"
            fi
          done

      # ═══════════════════════════════════════════════════════════
      #  MATRIX TASK: security
      # ═══════════════════════════════════════════════════════════
      - name: Install cargo-audit
        if: matrix.task == 'security'
        run: cargo install cargo-audit --locked

      - name: Run repository security gates
        if: matrix.task == 'security'
        run: pnpm security-check

      # ───────────────────────────────────────────────────────────────────────
      #  MATRIX TASK: container
      # ───────────────────────────────────────────────────────────────────────
      - name: Build deployment images
        if: matrix.task == 'container'
        run: |
          docker build --file infra/Dockerfile.hono --tag axiom-hono:ci .
          docker build --file infra/Dockerfile.next --tag axiom-dashboard:ci .
          docker build --file infra/Dockerfile.rust --tag axiom-egress-plane:ci .

      - name: Smoke-test deployment containers
        if: matrix.task == 'container'
        run: |
          set -euo pipefail

          cleanup() {
            docker rm --force axiom-egress-ci axiom-hono-ci axiom-dashboard-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_for_health() {
            local container="$1"
            for _ in $(seq 1 45); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
              case "$status" in
                healthy)
                  echo "$container: healthy"
                  return 0
                  ;;
                unhealthy)
                  echo "$container: unhealthy"
                  docker logs "$container"
                  return 1
                  ;;
              esac
              if [ "$(docker inspect --format '{{.State.Status}}' "$container")" = "exited" ]; then
                echo "$container: exited before becoming healthy"
                docker logs "$container"
                return 1
              fi
              sleep 2
            done
            echo "$container: healthcheck timeout"
            docker logs "$container"
            return 1
          }

          ci_auth_value='ci-authentication-value-012345678901'
          ci_relay_value='ci-relay-value-012345678901234567'

          docker run --detach --name axiom-egress-ci --network host --cap-add=NET_ADMIN axiom-egress-plane:ci
          docker run --detach --name axiom-hono-ci --network host \
            --env NODE_ENV=production \
            --env API_HOST=0.0.0.0 \
            --env DATABASE_URL=postgresql://axiom:changeme@127.0.0.1:5432/axiom_test \
            --env BETTER_AUTH_SECRET="$ci_auth_value" \
            --env BETTER_AUTH_URL=http://127.0.0.1:3001 \
            --env RELAY_SECRET="$ci_relay_value" \
            axiom-hono:ci
          docker run --detach --name axiom-dashboard-ci --network host \
            --env NODE_ENV=production \
            --env PORT=3000 \
            --env HOSTNAME=0.0.0.0 \
            axiom-dashboard:ci

          wait_for_health axiom-egress-ci
          wait_for_health axiom-hono-ci
          wait_for_health axiom-dashboard-ci

          # Liveness only proves that the Hono process is serving HTTP. The
          # readiness endpoint performs the real database dependency check;
          # require it before declaring the deployment image healthy.
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/ready >/dev/null; then
              echo "axiom-hono-ci: ready"
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/ready >/dev/null; then
            echo "axiom-hono-ci: readiness check failed"
            docker logs axiom-hono-ci
            exit 1
          fi
