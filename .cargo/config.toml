# AXIOM FanvueCRM — Cargo Configuration
# Hot-path plane: egress, media, vision, scraper

[net]
retry = 3

[build]
# NOTE: target-cpu=native intentionally NOT set here. It makes release builds
# non-reproducible and can emit instructions that SIGILL on hosts whose CPU
# differs from the build machine (e.g. CI/dev builds deployed to the Contabo
# VPS). Tune codegen locally via RUSTFLAGS when benchmarking instead.

[target.x86_64-unknown-linux-gnu]
linker = "cc"

[profile.release]
opt-level = 3
# Use single-threaded codegen for deterministic release builds on constrained boxes
codegen-units = 1
lto = "fat"
strip = "symbols"
debug = false
panic = "abort"
