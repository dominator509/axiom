[package]
name = "axiom-rand-regression"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
entropy-fault-injection = []

[dependencies]
rand08 = { package = "rand", version = "=0.8.6", features = ["log"] }
rand10 = { package = "rand", version = "=0.10.1", features = ["log"] }
log = "=0.4.32"
rand_chacha = "=0.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
