version: "3.9"

networks:
  axiom-net:
    driver: bridge

volumes:
  pgdata:

services:
  postgres:
    image: timescale/timescaledb:2-pg16-vector
    container_name: axiom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: axiom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - axiom-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: axiom-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@axiom.local
      PGADMIN_DEFAULT_PASSWORD: changeme
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - axiom-net
    profiles:
      - tools
